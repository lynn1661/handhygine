services:
  frontend:
    build: 
      context: new-ai-handwash-APK
    ports:
      - "8080:80"
    restart: always
    volumes:
      - nginx_config:/etc/nginx/conf.d

  backend:
    build: 
      context: ai-handwash-assist-server-main
    ports:
      - "3000:3000"
    restart: always

  ai:
    build: 
      context: new-ai-handwash-server
    ports:
      - "9500:9500"
    restart: always

volumes:
  nginx_config: