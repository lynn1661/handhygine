services:
  frontend:
    build: 
      context: new-ai-handwash-APK
    ports:
      - "8080:80"
    restart: always
    networks:
      - app-network
    depends_on:
      - backend
      - ai

  backend:
    build: 
      context: ai-handwash-assist-server-main
    ports:
      - "3000:3000"
    restart: always
    networks:
      - app-network

  ai:
    build: 
      context: new-ai-handwash-server
    ports:
      - "9500:9500"
    restart: always
    networks:
      - app-network


networks:
  app-network:
    driver: bridge