<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils_3d@0.3/control_utils_3d.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils@0.6/control_utils.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="hands.css"
      crossorigin="anonymous"
    />
    <link rel="icon" href="images/OIP.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A minimalistic PWA made with Parcel" />
    <link rel="apple-touch-icon" href="images/OIP.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils@0.6/control_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils_3d@0.3/control_utils_3d.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <style>
      .square-box {
        width: 33%;
        height: 0;
        padding-top: 33%;
        position: absolute;
        right: 20px;
        top: 20px;
      }

      .landmark-grid-container {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: #99999999;
      }
      #textContainer {
        position: absolute;
        z-index: 1;
        color: red;
        font-size: 45px;
        font-weight: 800;
        padding: 50px;
      }
      #probabilitiesList {
        position: absolute;
        z-index: 1;
        font-size: 32px;
        padding: 100px 50px 50px 50px;
        list-style-type: none;
        display: grid;
      }
      #videoSourcecontainer {
        position: absolute;
        width: 300px;
        right: 0;
        padding: 15px;
        background: #000;
        color: #fff;
        z-index: 1;
        opacity: 0.5;
      }
    </style>
    <div id="textContainer"></div>
    <div id="probabilitiesList"></div>
    <!-- <div id="videoSourcecontainer">
      <div class="select">
        <label for="videoSource">Video source: </label
        ><select id="videoSource"></select>
      </div>
    </div> -->
    <div class="container">
      <video class="input_video"></video>
      <canvas class="output_canvas" width="1280px" height="720px"></canvas>
      <div class="loading">
        <div class="spinner"></div>
        <div class="message">Loading</div>
      </div>
    </div>
    <div>
      <div class="control-panel"></div>
    </div>
    <script>
      // 注册 Service Worker
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/ServiceWorker.js")
          .then(function (registration) {
            console.log("Service Worker 注册成功:", registration);
          })
          .catch(function (error) {
            console.log("Service Worker 注册失败:", error);
          });
      }
    </script>
  </body>
</html>
<script src="main.js"></script>
<script src="hands.js"></script>
