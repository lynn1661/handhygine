server {
  server_name frontend2.polyuhandhygiene.com;
  
  # 前端应用
  location / {
    proxy_pass http://localhost:8080;
  }
  
  # API后端服务代理
  location /api/backend/ {
    proxy_pass http://localhost:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Access-Control-Allow-Origin *;
  }
  
  # Socket.io服务代理 - 直接匹配socket.io路径
  location /socket.io/ {
    proxy_pass http://localhost:9500/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Access-Control-Allow-Origin *;
    client_max_body_size 5M;
  }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/frontend2.polyuhandhygiene.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/frontend2.polyuhandhygiene.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
} 